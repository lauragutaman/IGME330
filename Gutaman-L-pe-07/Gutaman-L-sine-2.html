<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phyllotaxis Pattern</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>
    <script>
        var n = 0;
        var c = 4;

        function setup() {
            createCanvas(400, 400);
            angleMode(DEGREES);
            colorMode(HSB); // 137.5 is measured in degrees
            background(0);
        }

        function draw() {
            var a = n * 137.3;
            var r = c * sqrt(n);

            var x = r * cos(a) + width / 2;
            var y = r * sin(a) + height / 2;

            // Draw a dot at the calculated position
            fill(a % 256,255,255); //to cycle back to zero with a%
            noStroke();
            ellipse(x, y, 8, 8);

            n++; 
        }
    </script>
</body>

</html>
