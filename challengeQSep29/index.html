        const makeCircle = (ctx, {
            x: theCircle.x,

            r: 30, 
            fillStyle: 'red',

        })
        
        const start = performance.now(); 
        let AnimationCircleRadius = 100; 

        let theCircle = { 
            x: 250, // Centered on canvas (500x500)
            y: 250
        }; 

        const frame = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            
            let timeElapsed = performance.now() - start;
            let angle = timeElapsed / 500; 

            let x = theCircle.x + Math.cos(angle) * AnimationCircleRadius;
            let y = theCircle.y + Math.sin(angle) * AnimationCircleRadius;

            makeCircle(ctx, x, y, 30); 

            // Requests the next frame to create a smooth animation loop
            requestAnimationFrame(frame);
        };

        // Start the loop
        requestAnimationFrame(frame);
