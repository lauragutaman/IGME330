<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>First Canvas</title>
    <style>
        canvas {
            border: 1px solid gray;
        }

        body {
            font-family: sans-serif;
        }

        button {
            font-size: 1.2em;
        }

        section {
            margin: .5em 0 .5em 0;
        }
    </style>
    <script>
        // #0 - in this class we will always use ECMAScript 5's "strict" mode
        // See what 'use strict' does here:
        // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions_and_function_scope/Strict_mode
        "use strict";

        // #1 call the `init` function after the pages loads
        window.onload = init;
        let ctx;
        let paused = false;
        let canvas;
        let createRectangles = true;
        let run = false; 
        // let play = true; 



        function init() {
            console.log("page loaded!");
            // #2 Now that the page has loaded, start drawing!

            // A - `canvas` variable points at <canvas> tag
            canvas = document.querySelector("canvas");
            ctx = canvas.getContext("2d");

            // B - the `ctx` variable points at a "2D drawing context"

            // C - all fill operations are now in red
            ctx.fillStyle = "red";

            // D - fill a rectangle with the current fill color
            ctx.fillRect(20, 20, 600, 440);



            // hard way of drawing yellow rectangle 

            ctx.fillStyle = "yellow";
            ctx.strokeStyle = "magenta";
            ctx.lineWidth = 10;


            ctx.beginPath()
            ctx.rect(120, 120, 400, 300);
            ctx.closePath()
            ctx.fill();
            ctx.stroke();

            // lines 

            ctx.beginPath();
            ctx.moveTo(20, 20);
            ctx.lineTo(640, 460);
            ctx.lineWidth = 8;
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(620, 20);
            ctx.lineTo(20, 460);
            ctx.closePath();
            ctx.stroke();

            // circle
            ctx.fillStyle = "orange";
            ctx.strokeStyle = "green";
            ctx.beginPath();
            ctx.arc(320, 240, 50, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            //semi-circle 
            ctx.fillStyle = "black"
            ctx.strokeStyle = "pink";
            ctx.beginPath();
            ctx.arc(320, 240, 20, 0, Math.PI, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // eyes 
            // left eye
            ctx.beginPath();
            ctx.arc(300, 220, 10, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();

            // right eye
            ctx.beginPath();
            ctx.arc(340, 220, 10, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 600 px line 

            ctx.beginPath();
            ctx.moveTo(10, 20);
            ctx.lineTo(610, 20);
            ctx.lineWidth = 20;
            ctx.closePath();
            ctx.stroke();

            setupUI();
            update();
            run = true; 




        }

        function drawRandomRect(ctx) {

            // ctx.fillStyle = getRandomColor();
            // ctx.strokeStyle = getRandomColor();
            // ctx.lineWidth = getRandomInt(2, 12);


            // ctx.beginPath()
            // ctx.rect(getRandomInt(0, 640), getRandomInt(0, 480), getRandomInt(10, 90), getRandomInt(10, 90));
            // ctx.closePath()
            // ctx.fill();
            // ctx.stroke();

            drawRectangle(ctx, getRandomInt(0, 640), getRandomInt(0, 480), getRandomInt(10, 90), getRandomInt(10, 90), getRandomColor(), getRandomInt(2, 12), getRandomColor())


        }

        // Event Handlers

        function canvasClicked(e) {
            let rect = e.target.getBoundingClientRect();
            let mouseX = e.clientX - rect.x;
            let mouseY = e.clientY - rect.y;
            console.log(mouseX, mouseY);

            for (let i = 0; i < 10; i++) {

                let x = getRandomInt(-100, 100) + mouseX;
                let y = getRandomInt(-100, 100) + mouseY;
                let width = getRandomInt(20, 50);
                let height = getRandomInt(20, 50);
                let color = getRandomColor();
                drawRectangle(ctx, x, y, width, height, color);


            }
        }

        // canvas helpers
        function drawRectangle(ctx, x, y, width, height, fillStyle = "black", lineWidth = 0, strokeStyle = "black") {
            ctx.save();
            ctx.fillStyle = strokeStyle;
            ctx.beginPath();
            ctx.rect(x, y, width, height);
            ctx.fill();
            if (lineWidth > 0) {
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = strokeStyle;
                ctx.stroke();
            }

            ctx.closePath();
            ctx.restore();


        }

        // helpers

        function setupUI() {
            document.querySelector("#btnPause").onclick = function () {
                paused = true;
            };

            document.querySelector("#btnPlay").onclick = function () {
                paused = false;
                if (run) return;
                run = true; 
                update();

                // if statement when play clicks, it goes faster, make it only one loop dont loop again 
                //go back to the original loop what does that mean 
                //.save() look into this would help to not increase 
                //see how this wokrs why it increases
            };

            canvas.onclick = canvasClicked;

            document.querySelector("#cbRectangles").onclick = function (e) {
                createRectangles = e.target.checked;
            }


        }

        function drawRandomSemi(ctx) {
            //semi-circle 
            ctx.fillStyle = getRandomColor();
            ctx.strokeStyle = getRandomColor();
            ctx.beginPath();
            ctx.arc(getRandomInt(0, 640), getRandomInt(0, 640), getRandomInt(0, 30), getRandomInt(0, 10), Math.PI, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

        }

        function update() {
            if (paused){
                run = false; 
                return
            }

            drawRandomSemi(ctx);
            if (createRectangles) drawRandomRect(ctx);
            requestAnimationFrame(update); 


        }

        function getRandomColor() {
            function getByte() {
                return 55 + Math.round(Math.random() * 200);
            }
            return "rgba(" + getByte() + "," + getByte() + "," + getByte() + ",.8)";
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
    </script>
</head>

<body>
    <canvas width="640" height="480">
    </canvas>

    <section>
        <button id="btnPlay">Play</button>
        <button id="btnPause">Pause</button>
    </section>
    <section>
        <span>
            <input type="checkbox" id="cbRectangles" checked>
            <label for="cbRectangles">Rectangles</label>
        </span>
    </section>
    <section>
        <p>Click on the screen to "spraypaint" rectangles (you probably want the screensaver to be paused)</p>
    </section>
</body>

</html>
