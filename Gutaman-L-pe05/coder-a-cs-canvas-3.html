<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>First Canvas</title>
    <style>
        canvas {
            border: 1px solid gray;
        }
    </style>
    <script>
        // #0 - in this class we will always use ECMAScript 5's "strict" mode
        // See what 'use strict' does here:
        // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Functions_and_function_scope/Strict_mode
        "use strict";

        // #1 call the `init` function after the pages loads
        window.onload = init;
        let ctx;


        function init() {
            console.log("page loaded!");
            // #2 Now that the page has loaded, start drawing!

            // A - `canvas` variable points at <canvas> tag
            let canvas = document.querySelector("canvas");
            ctx = canvas.getContext("2d");

            // B - the `ctx` variable points at a "2D drawing context"

            // C - all fill operations are now in red
            ctx.fillStyle = "red";

            // D - fill a rectangle with the current fill color
            ctx.fillRect(20, 20, 600, 440);



            // hard way of drawing yellow rectangle 

            ctx.fillStyle = "yellow";
            ctx.strokeStyle = "magenta";
            ctx.lineWidth = 10;


            ctx.beginPath()
            ctx.rect(120, 120, 400, 300);
            ctx.closePath()
            ctx.fill();
            ctx.stroke();

            // lines 

            ctx.beginPath();
            ctx.moveTo(20, 20);
            ctx.lineTo(640, 460);
            ctx.lineWidth = 8;
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(620, 20);
            ctx.lineTo(20, 460);
            ctx.closePath();
            ctx.stroke();

            // circle
            ctx.fillStyle = "orange";
            ctx.strokeStyle = "green";
            ctx.beginPath();
            ctx.arc(320, 240, 50, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            //semi-circle 
            ctx.fillStyle = "black"
            ctx.strokeStyle = "pink";
            ctx.beginPath();
            ctx.arc(320, 240, 20, 0, Math.PI, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // eyes 
            // left eye
            ctx.beginPath();
            ctx.arc(300, 220, 10, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();

            // right eye
            ctx.beginPath();
            ctx.arc(340, 220, 10, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 600 px line 

            ctx.beginPath();
            ctx.moveTo(10, 20);
            ctx.lineTo(610, 20);
            ctx.lineWidth = 20;
            ctx.closePath();
            ctx.stroke();


        }

        function drawRandomRect(ctx) {

            ctx.fillStyle = getRandomColor();
            ctx.strokeStyle = getRandomColor();
            ctx.lineWidth = getRandomInt(2, 12);


            ctx.beginPath()
            ctx.rect(getRandomInt(0, 640), getRandomInt(0, 480), getRandomInt(10, 90), getRandomInt(10, 90));
            ctx.closePath()
            ctx.fill();
            ctx.stroke();
            update();

        }

        function drawRandomSemi(ctx) {
            //semi-circle 
            ctx.fillStyle = getRandomColor();
            ctx.strokeStyle = getRandomColor();
            ctx.beginPath();
            ctx.arc(getRandomInt(0,640), getRandomInt(0,640), getRandomInt(0,30), getRandomInt(0,10), Math.PI, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            update();
        }

        function update() {
            requestAnimationFrame(() => drawRandomRect(ctx));
            requestAnimationFrame(()=> drawRandomSemi(ctx));

        }

        function getRandomColor() {
            function getByte() {
                return 55 + Math.round(Math.random() * 200);
            }
            return "rgba(" + getByte() + "," + getByte() + "," + getByte() + ",.8)";
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
    </script>
</head>

<body>
    <canvas width="640" height="480">
    </canvas>
</body>

</html>
